<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password - QueryCrest</title><style>body{margin:0;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#fff 0%,#dfe4ff 100%);color:#1f1c2c;min-height:100vh;display:flex;flex-direction:column}nav{display:flex;justify-content:space-between;align-items:center;padding:18px 40px;background:rgba(255,255,255,.95);border-bottom:1px solid rgba(0,0,0,.05)}nav .logo{display:flex;align-items:center;gap:10px;font-size:1.6rem;font-weight:700}nav .logo img{width:40px;height:40px;object-fit:contain}.reset-page{display:flex;flex:1;min-height:calc(100vh - 70px)}.reset-left{flex:1;background:rgba(32,32,45,.6);backdrop-filter:blur(12px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px;color:#fff;text-align:center}.reset-left h1{font-size:2.8rem;margin-bottom:15px}.reset-left p{font-size:1.2rem;max-width:400px;opacity:.9}.reset-left img{width:200px;margin-top:20px}.reset-right{flex:1;display:flex;justify-content:center;align-items:center;padding:50px}.reset-card{background:rgba(31,28,44,.95);padding:40px;border-radius:20px;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(0,0,0,.25);animation:slideFadeIn 0.6s ease forwards}.reset-card h2{text-align:center;margin-bottom:25px;color:#fff;font-size:2rem}.reset-card input{width:100%;padding:16px;margin-bottom:18px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:1.1rem}.reset-card input::placeholder{color:rgba(255,255,255,.7)}.reset-card button{width:100%;padding:16px;border:none;border-radius:10px;background:#4a90e2;color:#fff;font-size:1.1rem;font-weight:600;cursor:pointer;display:flex;justify-content:center;align-items:center;position:relative;transition:all .3s ease}.reset-card button:hover{background:#357ABD}.reset-card button:disabled{opacity:.6;cursor:not-allowed}#spinner{display:none;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}@keyframes spin{to{transform:rotate(360deg)}}#resetMessage{margin-top:12px;font-size:1rem;text-align:center}@keyframes slideFadeIn{0%{opacity:0;transform:translateY(-40px) scale(.95)}100%{opacity:1;transform:translateY(0) scale(1)}}@media(max-width:900px){.reset-page{flex-direction:column}.reset-left,.reset-right{flex:none;width:100%;padding:40px 25px;box-sizing:border-box}.reset-left img{width:150px;margin-top:15px}}@media(max-width:480px){.reset-left h1{font-size:2rem}.reset-left p{font-size:1rem}.reset-card h2{font-size:1.5rem}.reset-card input,.reset-card button{font-size:1rem;padding:12px}}</style></head><body><nav><div class="logo"><img src="../images/logo.png" alt="QueryCrest">QueryCrest</div></nav><div class="reset-page"><div class="reset-left"><h1>Password Reset</h1><p>Enter your new password below to regain access to your QueryCrest account. Make sure your password is strong and unique.</p><img src="https://tse4.mm.bing.net/th/id/OIP.5Tk9fZeQFBkRpwHL8nHg8gHaHa?cb=ucfimg2&ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Reset Illustration"></div><div class="reset-right"><div class="reset-card"><h2>Reset Your Password</h2><form id="resetForm"><input type="password" id="newPassword" placeholder="New Password" required><input type="password" id="confirmPassword" placeholder="Confirm Password" required><button type="submit"><span class="btn-text">Reset Password</span><div id="spinner"></div></button><p id="resetMessage"></p></form><p style="margin-top:12px;text-align:center;"><a href="login-signup.html" style="color:#4a90e2;text-decoration:underline;">Back to Login</a></p></div></div></div><script type="module">const f=document.getElementById("resetForm"),n=document.getElementById("newPassword"),c=document.getElementById("confirmPassword"),m=document.getElementById("resetMessage"),b=f.querySelector("button"),s=document.getElementById("spinner"),t=b.querySelector(".btn-text"),p=new URLSearchParams(window.location.hash.substring(1)).get("access_token");if(!p){m.textContent="Invalid or missing token.";m.style.color="red";b.disabled=!0}f.addEventListener("submit",async e=>{e.preventDefault();m.textContent="";m.style.color="red";const a=n.value.trim(),r=c.value.trim();if(a!==r){m.textContent="Passwords do not match.";return}s.style.display="block";t.style.visibility="hidden";b.disabled=!0;try{const d=await fetch("https://icvegtgayxjqtwpyhqpm.supabase.co/functions/v1/resetPasswordWithToken",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:p,newPassword:a})}),data=await d.json();if(!d.ok){m.textContent=data.error;return}m.style.color="green";m.textContent="Password reset successfully! Redirecting...";setTimeout(()=>{window.location.href="login-signup.html"},2e3)}catch(e){m.textContent="Unexpected error occurred."}finally{s.style.display="none";t.style.visibility="visible";b.disabled=!1}});</script></body></html>
