<script>

window.dashNavTo = function(page){
  document.querySelectorAll('section.section').forEach(function(s){ s.style.display='none'; });
  var target=document.getElementById(page); if(target) target.style.display='block';
  document.querySelectorAll('.ni[data-p]').forEach(function(b){ b.classList.remove('on'); });
  document.querySelectorAll('.ni[data-p="'+page+'"]').forEach(function(b){ b.classList.add('on'); });
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('drawerBg').classList.remove('show');
  if(window.location.hash!=='#'+page) history.replaceState(null,'','#'+page);

  if     (page==='dashboard')         { renderDashboardOverview(); }
  else if(page==='search')     { renderSearchPage(); }
  else if(page==='add-data')           { renderDataPage(); }


};
