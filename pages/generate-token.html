<!DOCTYPE html>
<html>
<head>
    <title>Generate Token</title>
</head>
<body>
    <h1>Generate Test Token</h1>
    <button onclick="generateToken()">Generate Token</button>
    <pre id="output"></pre>

    <script>
    async function generateToken() {
        const output = document.getElementById('output');
        output.textContent = 'Generating...';
        
        try {
            // Step 1: Verify code
            const step1 = await fetch('https://xkjsydeavdcarwkthppz.supabase.co/functions/v1/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    step: '1',
                    verification_code: '123456'  // Use your actual code
                })
            });
            const step1Data = await step1.json();
            console.log('Step 1:', step1Data);
            
            if (!step1Data.success) {
                output.textContent = 'Step 1 failed: ' + JSON.stringify(step1Data, null, 2);
                return;
            }
            
            // Step 2: Get token
            const step2 = await fetch('https://xkjsydeavdcarwkthppz.supabase.co/functions/v1/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    step: '2',
                    admin_password: 'admin'  // Use your actual password
                })
            });
            const step2Data = await step2.json();
            console.log('Step 2:', step2Data);
            
            if (step2Data.token) {
                // Store the token
                sessionStorage.setItem('admin_token', step2Data.token);
                sessionStorage.setItem('admin_token_expiry', (Date.now() + 3600000).toString());
                output.textContent = '✅ Token generated and stored!\n\n' + JSON.stringify(step2Data, null, 2);
                console.log('Token stored:', step2Data.token);
            } else {
                output.textContent = 'Failed to get token: ' + JSON.stringify(step2Data, null, 2);
            }
        } catch (error) {
            output.textContent = 'Error: ' + error.message;
            console.error(error);
        }
    }
    </script>
</body>
</html>
