<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>

<style>
:root {
  --brand:       #2563eb;
  --brand-dark:  #1d4ed8;
  --brand-light: #eff6ff;
  --brand-border:#bfdbfe;
  --text:        #0f172a;
  --text-2:      #334155;
  --text-muted:  #64748b;
  --border:      #e2e8f0;
  --bg:          #f8fafc;
  --white:       #ffffff;
  --success:     #16a34a;
  --warning:     #d97706;
  --danger:      #dc2626;
  --r-sm:        8px;
  --r-md:        14px;
  --r-lg:        20px;
  --shadow-sm:   0 1px 3px rgba(0,0,0,0.07);
  --shadow-md:   0 4px 14px rgba(0,0,0,0.10);
  --shadow-lg:   0 12px 32px rgba(0,0,0,0.14);
}

  *{ box-sizing:border-box; }
body{
  background-color: white;
}



/*chatbot widget*/
.chatbot-toggle {
  pointer-events: auto;
  width: 54px;
  height: 54px;
  border-radius:60px ;
  background: var(--brand);
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow-lg);
  border: none;
  color: var(--bg);
  font-size:2rem ;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.2 cubic-bezier(0.2,0.9,0.4,1);
  border: 1px solid rbga(255,225,225,0.25); 
  position:fixed;
  right:20px;
  bottom:170px;
   visibility: visible;
  /*animation: float-gentle 4s infinite alternate ease-in-out;*/
  z-index: 999;
}

.chatbot-toggle.hide {
 
  opacity: 0;
  visibility: hidden;
}

.chatbot-toggle:hover {
  transform: scale(1.07) rotate(2deg);
  background: var(--brand);
  box-shadow: var(--shadow-md);

}

.chatbot-toggle:active {
  transform: scale(0.92);
  transition-duration:0.04s ;
}

.chatbot-toggle::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 60px;

  opacity: 0.5;
}

.chatbot{
  position: fixed;
  top: 100px;
  right:80px;
  width: 100%;
  max-width: 480px;

  height: min(620px,92vh);
  display: flex;
  flex-direction: column;
  background: #f7f8fc;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 25px 60px rgba(0,0,0,0.35);

  z-index: 1000;
transition: opacity .25s ease, visibility .25s ease;  
}

.chatbot.hide {
 
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s ease, visibility 0s .25s;  
}

.chatbot-header {
 /* height: 70px;*/
  display:flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  background :linear-gradient(135deg,rgba(0, 6, 41, 0.98) ,var(--brand));
  border-bottom: 1px solid #e8ecf3;

}
/* */
.chatbot-header .bot-avatar {
  width: 35px;
  height:35px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background-color: rgba(145, 145, 230, 0.4);
  font-size:36px; 
  color: rgba(145, 145, 230, 0.623);
}
.chatbot-header h1 {
  margin:0;
  font-size: 15px;
  font-weight: 700;
  color: white;

}
.chatbot-header p{
  margin:2px 0 0;
  font-size: 12px;
  color:white;
  display: flex;
  align-items: center;
  gap: 5px;
}
.chatbot-header p::before{
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: green;

}
.cbAddChat-btn ,.cbCancel-btn {

  width: 50px;
  height: 50px;
  border-style: none;
  background: none;
  border-radius: 100px;


 }
  .cbAddChat-btn i, .cbCancel-btn i{
    font-size: 36px;
    border-radius: 12px;
    color: var(--brand-dark);
  }
  
.chatbot-top-ui-right {
  margin-left: auto;
  display: block;

}
.chatbot-top-ui-right i {
  background-color: rgba(145, 145, 230, 0.4);
}

.chatbot-messages{
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
}

.chatbot-messages::-webkit-scrollbar{
  width: 8px;
}
.chatbot-messages::-webkit-scrollbar-thumb{
  background: var(--brand);
  border-radius: 8px;

}
.message{
    display:flex;
    align-items:flex-end;
    gap:10px;
    animation:pop .25s ease both;
}

.message.user{
 flex-direction: row-reverse;
}

 .avater {
    flex:0 0 auto;
    width:40px;height:40px;border-radius:50%;
    display:grid;place-items:center;
    font-size:36px;
    background:#e2e8f0;

}
.message.user .avater{
  color: white;
  background: var(--brand);
}
.message.bot .avater{
  color:var(--brand);

}

.bubble{
max-width: 78%;
padding: 12px 14px;
font-size: 14.5px;
line-height: 1.5;
background: #fff;
border-radius: 16px;
border-bottom-left-radius: 4px;
box-shadow: 0 1px 2px rgba(16,24,40,0.08);
word-wrap: break-word;
}

.message.user .bubble{
  background: var(--brand);
  color: #fff;
  border-radius: 16px;
  border-bottom-right-radius: 4px;
}

.message.wide .bubble{
  max-width: 88%;
}

.bubble p{
  margin:0 0 4px;
}
.bubble p:last-child{
    margin-bottom: 0;
  }

/* In chat form*/
.intro-form{
 display: flex;
 flex-direction: column;
 gap: 10px;
 margin-top: 12px;
}

.intro-form label{
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color:var(--brand);
}

.intro-form input {
  width: 100%;
  padding:9px  11px;
  font-size:14px;
  color:var(--text);
  border:1px solid var(--brand);
  border-radius:10px;
  outline: none;
  transition: border-color .15s ,box-shadow .15s;
}

.intro-form input:focus{
  border-color: var(--brand-border);
  box-shadow: 0 0 0 3px rgba(79,70,229,.15);
}

.intro-form input:disabled{
  background: #f1f5f9;
  color: var(--text-muted);
  cursor: not-allowed;
}

.intro-form button {
  margin-top: 2px;
  padding: 10px;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  background: var(--brand);
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  transition: background .25s,transform .1s;
}

.intro-form button:hover:not(:disabled){background: var(--brand-dark);}
.intro-form button:active:not(:disabled){transform: scale(.98);}
.intro-form button:disabled{background: #a5b4fc; cursor: default;}

.intro-form .error{
  display: none;
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  color: red;

}

/*user details message*/
.details div {
  font-size:13.5px;
  line-height: 1.6;

}
.details strong {
  opacity:0.75; 
  font-weight: 600;

}


/*typing indicator*/
.bubble.typing {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 15px 16px;
}

.bubble.typing span{
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--brand);
  animation: bounce 1.2s infinite ease-in-out;
}

.bubble.typing span:nth-child(2){
  animation-delay: .15s;
}
.bubble.typing span:nth-child(3){
  animation-delay: .3s;  
}


.chatbotform{
  display:flex;
  gap:8px;
  padding: 12px;
  background: #fff;
  border-top: 1px solid #e8ecf3;
}

.chatbotform input {
  flex:1;
  min-width: 0;
  padding: 11px 16px;
  font-size: 14px;
  color: var(--text);
  border: 1px solid #cbd5e1;
  border-radius: 999px;
  outline: none;
  transition: border-color .15s ,box-shadow .15s;
}

.chatbotform input:focus{
  border-color:var(--brand);
  box-shadow: 0 0 0 3px rgba(79,70,229,.15);

}

.chatbotform input:disabled{
background: #f1f5f9;
cursor: not-allowed;

}

.chatbotform button{
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 25%;
  background: linear-gradient(135deg,rgba(0, 6, 41, 0.98) ,var(--brand));;
  color: #fff;
  font-size: 17px;
  cursor: pointer;
  transition: background .15s,transform .10s;
}

.chatbotform button:hover:not(:disabled){background: var(--brand-dark);}
.chatbotform button:active:not(:disabled){transform: scale(.94);}
.chatbotform button:disabled{background: #c7d2fe; cursor: not-allowed;}

@keyframes pop{
  from{opacity: 0;
  transform: translateY(8px);}
  to{opacity: 1;
  transform: none;}
}
@keyframes bounce{
  0%,60%,100%{
    transform: translateY(0);
    opacity: .5;
  }
  30%{
    transform: translateY(-5px);
    opacity: 1;
  }
}

<body>
