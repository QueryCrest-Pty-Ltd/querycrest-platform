<html lang="en">
<head>

<style>
:root {
  --brand:       #2563eb;
  --brand-dark:  #1d4ed8;
  --brand-light: #eff6ff;
  --brand-border:#bfdbfe;
  --text:        #0f172a;
  --text-2:      #334155;
  --text-muted:  #64748b;
  --border:      #e2e8f0;
  --bg:          #f8fafc;
  --white:       #ffffff;
  --success:     #16a34a;
  --warning:     #d97706;
  --danger:      #dc2626;
  --r-sm:        8px;
  --r-md:        14px;
  --r-lg:        20px;
  --shadow-sm:   0 1px 3px rgba(0,0,0,0.07);
  --shadow-md:   0 4px 14px rgba(0,0,0,0.10);
  --shadow-lg:   0 12px 32px rgba(0,0,0,0.14);
}

  *{ box-sizing:border-box; }
body{
  background-color: white;
}

  /* ---------- Typing indicator ---------- */
  .bubble.typing{
    display:flex;
    align-items:center;
    gap:4px;
    padding:15px 16px;
  }
  .bubble.typing span{
    width:7px;height:7px;border-radius:50%;
    background:#94a3b8;
    animation:bounce 1.2s infinite ease-in-out;
  }
  .bubble.typing span:nth-child(2){ animation-delay:.15s; }
  .bubble.typing span:nth-child(3){ animation-delay:.3s; }


/*chatbot widget*/
.chatbot-toggle {
  pointer-events: auto;
  width: 54px;
  height: 54px;
  border-radius:60px ;
  background: var(--brand);
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow-lg);
  border: none;
  color: var(--bg);
  font-size:2rem ;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.2 cubic-bezier(0.2,0.9,0.4,1);
  border: 1px solid rbga(255,225,225,0.25); 
  position:fixed;
  right:20px;
  bottom:170px;
   visibility: visible;
  /*animation: float-gentle 4s infinite alternate ease-in-out;*/
  z-index: 999;
}

.chatbot-toggle.hide {
 
  opacity: 0;
  visibility: hidden;
}

.chatbot-toggle:hover {
  transform: scale(1.07) rotate(2deg);
  background: var(--brand);
  box-shadow: var(--shadow-md);

}

.chatbot-toggle:active {
  transform: scale(0.92);
  transition-duration:0.04s ;
}

.chatbot-toggle::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 60px;

  opacity: 0.5;
}

.chatbot{
  position: fixed;
  top: 100px;
  right:80px;
  width: 100%;
  max-width: 480px;

  height: min(620px,92vh);
  display: flex;
  flex-direction: column;
  background: #f7f8fc;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 25px 60px rgba(0,0,0,0.35);

  z-index: 1000;
transition: opacity .25s ease, visibility .25s ease;  
}

.chatbot.hide {
 
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s ease, visibility 0s .25s;  
}

.chatbot-header {
 /* height: 70px;*/
  display:flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  background :linear-gradient(135deg,rgba(0, 6, 41, 0.98) ,var(--brand));
  border-bottom: 1px solid #e8ecf3;

}
/* */
.chatbot-header .bot-avatar {
  width: 35px;
  height:35px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background-color: rgba(145, 145, 230, 0.4);
  font-size:36px; 
  color: rgba(145, 145, 230, 0.623);
}
.chatbot-header h1 {
  margin:0;
  font-size: 15px;
  font-weight: 700;
  color: white;

}
.chatbot-header p{
  margin:2px 0 0;
  font-size: 12px;
  color:white;
  display: flex;
  align-items: center;
  gap: 5px;
}
.chatbot-header p::before{
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: green;

}
.cbAddChat-btn ,.cbCancel-btn {

  width: 50px;
  height: 50px;
  border-style: none;
  background: none;
  border-radius: 100px;


 }
  .cbAddChat-btn i, .cbCancel-btn i{
    font-size: 36px;
    border-radius: 12px;
    color: var(--brand-dark);
  }
  
.chatbot-top-ui-right {
  margin-left: auto;
  display: block;

}
.chatbot-top-ui-right i {
  background-color: rgba(145, 145, 230, 0.4);
}

.chatbot-messages{
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
}

.chatbot-messages::-webkit-scrollbar{
  width: 8px;
}
.chatbot-messages::-webkit-scrollbar-thumb{
  background: var(--brand);
  border-radius: 8px;

}
.message{
    display:flex;
    align-items:flex-end;
    gap:10px;
    animation:pop .25s ease both;
}

.message.user{
 flex-direction: row-reverse;
}

 .avater {
    flex:0 0 auto;
    width:40px;height:40px;border-radius:50%;
    display:grid;place-items:center;
    font-size:36px;
    background:#e2e8f0;

}
.message.user .avater{
  color: white;
  background: var(--brand);
}
.message.bot .avater{
  color:var(--brand);

}

.bubble{
max-width: 78%;
padding: 12px 14px;
font-size: 14.5px;
line-height: 1.5;
background: #fff;
border-radius: 16px;
border-bottom-left-radius: 4px;
box-shadow: 0 1px 2px rgba(16,24,40,0.08);
word-wrap: break-word;
}

.message.user .bubble{
  background: var(--brand);
  color: #fff;
  border-radius: 16px;
  border-bottom-right-radius: 4px;
}

.message.wide .bubble{
  max-width: 88%;
}

.bubble p{
  margin:0 0 4px;
}
.bubble p:last-child{
    margin-bottom: 0;
  }

/* In chat form*/
.intro-form{
 display: flex;
 flex-direction: column;
 gap: 10px;
 margin-top: 12px;
}

.intro-form label{
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color:var(--brand);
}

.intro-form input {
  width: 100%;
  padding:9px  11px;
  font-size:14px;
  color:var(--text);
  border:1px solid var(--brand);
  border-radius:10px;
  outline: none;
  transition: border-color .15s ,box-shadow .15s;
}

.intro-form input:focus{
  border-color: var(--brand-border);
  box-shadow: 0 0 0 3px rgba(79,70,229,.15);
}

.intro-form input:disabled{
  background: #f1f5f9;
  color: var(--text-muted);
  cursor: not-allowed;
}

.intro-form button {
  margin-top: 2px;
  padding: 10px;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  background: var(--brand);
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  transition: background .25s,transform .1s;
}

.intro-form button:hover:not(:disabled){background: var(--brand-dark);}
.intro-form button:active:not(:disabled){transform: scale(.98);}
.intro-form button:disabled{background: #a5b4fc; cursor: default;}

.intro-form .error{
  display: none;
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  color: red;

}

/*user details message*/
.details div {
  font-size:13.5px;
  line-height: 1.6;

}
.details strong {
  opacity:0.75; 
  font-weight: 600;

}


/*typing indicator*/
.bubble.typing {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 15px 16px;
}

.bubble.typing span{
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--brand);
  animation: bounce 1.2s infinite ease-in-out;
}

.bubble.typing span:nth-child(2){
  animation-delay: .15s;
}
.bubble.typing span:nth-child(3){
  animation-delay: .3s;  
}


.chatbotform{
  display:flex;
  gap:8px;
  padding: 12px;
  background: #fff;
  border-top: 1px solid #e8ecf3;
}

.chatbotform input {
  flex:1;
  min-width: 0;
  padding: 11px 16px;
  font-size: 14px;
  color: var(--text);
  border: 1px solid #cbd5e1;
  border-radius: 999px;
  outline: none;
  transition: border-color .15s ,box-shadow .15s;
}

.chatbotform input:focus{
  border-color:var(--brand);
  box-shadow: 0 0 0 3px rgba(79,70,229,.15);

}

.chatbotform input:disabled{
background: #f1f5f9;
cursor: not-allowed;

}

.chatbotform button{
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 25%;
  background: linear-gradient(135deg,rgba(0, 6, 41, 0.98) ,var(--brand));;
  color: #fff;
  font-size: 17px;
  cursor: pointer;
  transition: background .15s,transform .10s;
}

.chatbotform button:hover:not(:disabled){background: var(--brand-dark);}
.chatbotform button:active:not(:disabled){transform: scale(.94);}
.chatbotform button:disabled{background: #c7d2fe; cursor: not-allowed;}

@keyframes pop{
  from{opacity: 0;
  transform: translateY(8px);}
  to{opacity: 1;
  transform: none;}
}
@keyframes bounce{
  0%,60%,100%{
    transform: translateY(0);
    opacity: .5;
  }
  30%{
    transform: translateY(-5px);
    opacity: 1;
  }
}

    top: 160px;

 }

 }

}
</style>

<body>


<!-- chatbot widget-->
<div class="chatbot hide" id="chatbotWidget">
<div class="chatbot-header">
<div class="bot-avatar"><i class="ph ph-robot"></i></div>
<div>
  <h1>QueryCrest Assistant</h1>
  <p>AI-Always available</p>
</div>
<div class="chatbot-top-ui-right">
<button class="cbAddChat-btn" id="addCbChatBtn"><span title="start new conversation"><i class="ph ph-plus"></i></span> </button>
  <button class="cbCancel-btn" id="cancelCbBtn"><i class="ph ph-x"></i></button>
</div>
</div>

 <div class="chatbot-messages" id="chatbot-messages" aria-live="polite"></div>


<form class="chatbotform" id="chatbotform" autocomplete="off">
<input type="text" id="chatbot-input" placeholder="Please complete the form above..." disabled>
<button class="chatbot-send-btn" id="sendChatbotBtn"><i class="ph ph-paper-plane-tilt"></i></button>

</form>


</div>
  <button class="chatbot-toggle" id="chatbotToggleBtn">
    <i class="ph ph-headset"></i>
  </button>

</div>


<!--chatbot-->
<script >
import validator from "npm:validator";
(async ()=>{
    
    "use strict"
     
    //refs
    const messagesEl = document.getElementById("chatbot-messages");
    const chatbotForm = document.getElementById("chatbotform");
    const chatInput = document.getElementById("chatbot-input");
    const sendBtn = document.getElementById("sendChatbotBtn");
    const chatbotToggleBtn = document.getElementById('chatbotToggleBtn');
    const chatbotWidget = document.getElementById('chatbotWidget');
    const cancelBtn = document.getElementById('cancelCbBtn');
    const newChatBtn = document.getElementById('addCbChatBtn');    
    const API_BASE = "https://xkjsydeavdcarwkthppz.supabase.co/functions/v1";
    let profile =null;
    let isWidgetVisible = false;    
    let intro = null;
    let clearChatId = null;

    function hideWiget(){
    chatbotWidget.classList.add('hide');
    isWidgetVisible = false;

  }

  function showWidget(){
    chatbotWidget.classList.remove('hide');
    isWidgetVisible = true;

  } 

  function clearChat(){
    alert("sss")
   if(messagesEl.children.length ===0)return
    // remove user details
    sessionStorage.removeItem("user-chatbot-details");
    //clear out the chats
   if(messagesEl.children.length !==0) messagesEl.replaceChildren();
   profile = null;
    chatInput.disabled =false;
    sendBtn.disabled =false;
    chatInput.value ="";
    chatInput.placeholder = "Please complete the form above…";
    chatInput.focus(); 
    startChat();
   clearChatId = null;    
  }
  // display or hide the chatbot card
  chatbotToggleBtn.addEventListener('click',function(e){
    e.stopPropagation();
    if(isWidgetVisible){
      hideWiget();
    }else showWidget();
  });
  
  // display or hide the chatbot card
  cancelBtn.addEventListener('click',function(e){
    e.stopPropagation();
    if(isWidgetVisible){
      hideWiget();
    }else showWidget();
  });



  
  // create new chat and get response without showing the detail form
  newChatBtn.addEventListener('click',async function (e){
    e.stopPropagation();
    if(isWidgetVisible){
  if(  sessionStorage.getItem('user-chatbot-details') ===null) return;
  const data =JSON.parse(sessionStorage.getItem('user-chatbot-details'));

  const history = await addChat("/chatbot/new",{...data,prompt:`you are connected to user : first name: ${data.firstName}  , surname: ${data.surname} , email:${data.email}`});
  if(history.error.length>0)alert(history.error);
  addMessage(buildUserDetailsMessage(data),'user');
  //unlock the chatbot form
  chatInput.disabled =false;
  sendBtn.disabled =false;
  chatInput.placeholder = "Type your message..";
  chatInput.focus();  

  /*    intro = sessionStorage.getItem("details_form");    
  const form = intro[0].querySelector(".intro-form");
  const errorEl = form.querySelector(".error");

    if(history.error.length>0){
      errorEl.textContent =history.error;
      errorEl.style.display ="block";
      return;
    }
    errorEl.style.display ="none"; 
    */
    //add bot response

    await addMessage(history.data,'bot',true);
    
    }
  });

  const escapeHtml = (str)=> String(str).replace(/[&,."'"]/g,(c) =>({"&":"&amp;","<":"&alt;",">":"&gt;",'"':"&quot;","'":"&339;"}[c])) 
  
  function scrollToBottom(){
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  // chat with Zuzu
  async function sendChat(endpoint, data) {
    try {
      const response = await fetch(`${API_BASE}${endpoint}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body:JSON.stringify({ firstName: data.firstName,
          surname:data.surname,
          email:data.email,
          prompt:data.prompt
      })
      });
      const data_ = await response.json();
      return data_;
    } catch (error) {
      return {error:`failed to fetch Zuzu response data ${error}`,data:[]};
    }
  }
  //add new chatbot history
  async function addChat(endpoint,data) {
    try {
      const response = await fetch(`${API_BASE}${endpoint} `, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body:JSON.stringify({ firstName: data.firstName,
          surname:data.surname,
          email:data.email,
          prompt:data.prompt
      })
      });
      const data_ = await response.json();
      return data_;
    } catch (error) {
      return {error:`failed to add new chat  ${error}`,data:[]};
    }
  }
  //get chatbot history
  async function getChat(endpoint, data) {
    try {
      const response = await fetch(`${API_BASE}${endpoint}`, {
        method: "GET",
        headers: { "Content-Type": "application/json" }
      });
      const data_ = await response.json();
      return data_;
    } catch (error) {
      return {error:`failed to fetch Zuzu response data ${error}`,data:[]};
    }
  }  
  

  /**
   * Append a message bubble.
   * @param{string|Node} content HTML string,plain string or dom node
   * @param {"bot"|"user"} sender
   * @param {boolean} asHTML render string as HTML (bot only)
   */
  function addMessage(content,sender,asHTML=false){
    const wrap = document.createElement("div");
    wrap.className = "message " + sender;

    const avatar = document.createElement("div");
    avatar.className ="avater";
    avatar.innerHTML = sender ==="bot" ? '<i class="ph ph-robot"></i>' :'<i class="ph ph-user"></i>' ; 

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if(content instanceof Node)bubble.appendChild(content);
    else if(asHTML) bubble.innerHTML = content;
    else bubble.textContent = content;
  
  wrap.append(avatar,bubble);
  messagesEl.appendChild(wrap)
  scrollToBottom()
  return wrap;
  
  }

  /* typing indicator*/
  function showTyping(){
    const wrap = document.createElement("div");
    wrap.className ="message bot";
    wrap.innerHTML = '<div class="bot"><i class="ph ph-robot"></i></div>'+
    '<div class "bubble typing"> <span></span><span></span><span></span> </div>';
    messagesEl.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  async function botSay(html,details){
    const typing = showTyping();

    if(html !=='<p>Connecting..</p>'){
    const data = {
      firstName:details.firstName,
      surname:details.surname,
      email:details.email,
      prompt:html
    }      
    const response = await sendChat('/chatbot',data);

    let chat ="";
    if(response.error)if(response.error.length>0)chat = response.error;else chat = response.data;
    else chat = response.data 
    const box =addMessage(chat,'bot',true);
    typing.remove();
    if(data.human_agent)window.location.href = "https://wa.me/27692483470?text=Hi%20QueryCrest%20%F0%9F%91%8B";
    return box
  }else{
   const box = addMessage(html,'bot',true);
    typing.remove();
    return box
  }
  }
  /*step 1 ask the user for details */
  function createIntroFormMessage(){
    const box = document.createElement("div");
    box.innerHTML =`
    <p>Hi there! <i class="ph ph-hand-waving"></i> Welcome</p>
    <p>Before we get started, could you please tell me your
      <strong>First name</strong>, <strong>surname</strong> and <strong>email</strong>?</p>

    <form class="intro-form" novalidate>
      <lable>First name
        <input type="text" name="firstName" placeholder="Zuzu" autocomplete="given-name">
        </lable>
      <lable>Surname
        <input type="text" name="surname" placeholder="Assistant" autocomplete="family-name">
        </lable>
      <lable>Email
        <input type="email" name="email" placeholder="zuzu@example.com" autocomplete="email">
        </lable>                
      <P class="error" role="alert"></p>
        <button type="submit">Submit</button>
        </form>

    `;
  return box;
  }

  function buildUserDetailsMessage(data){
   const box = document.createElement("div");
   box.className ="details";
   [["First name",data.firstName],
    ["Surname",data.surname],
    ["Email",data.email] 
  ].forEach(([label,value]) =>{
    const row = document.createElement("div");
    const strong = document.createElement("strong");
    strong.textContent = label+": ";
    row.appendChild(strong);
    row.appendChild(document.createTextNode(value));
    box.appendChild(row);

  });
  return box
  }
  async function startChat(){
    intro = createIntroFormMessage();
   //if(sessionStorage.getItem("details_form")===null)sessionStorage.setItem("details_form",intro);

   const wrap = await botSay('<p>Connecting..</p>',{firstName:null,surname:null,email:null});

   const bubble = wrap.querySelector(".bubble");
   bubble.innerHTML ="";
   bubble.appendChild(intro);
   wrap.classList.add("wide");
   scrollToBottom();
   
   const form = intro.querySelector(".intro-form");
   const errorEl = form.querySelector(".error");
  
   form.addEventListener("submit",async(e) =>{
    e.preventDefault();

    const data = {
      firstName:form.firstName.value.trim(),
      surname:form.surname.value.trim(),
      email:form.email.value.trim()            
    };

    //validation
    let problem ="";
    if(!data.firstName) problem = "Please enter your first name,";
    if(!data.surname)problem = "Please enter your surname name,";
    if(!data.email)problem = "Please enter your email address,";
    if(!validator.isEmail(data.email))problem = "Please enter a valid email address,";  
    if(problem){
      errorEl.textContent =problem;
      errorEl.style.display ="block";
      return;
    }
    errorEl.style.display ="none";

    // lock the form
    profile = data;
    form.querySelectorAll("input").forEach((i)=> (i.disabled=true));
    const submitBtn = form.querySelector("button");
    submitBtn.disabled =true;
    submitBtn.innerHTML ='<i class="ph ph-check"></i> submitted';
    
    // add details as a user
    
    sessionStorage.setItem('user-chatbot-details',JSON.stringify(data))
        // bot reply
    addMessage(buildUserDetailsMessage(data),'user');
    
    //unlock the chatbot form
    chatInput.disabled =false;
    sendBtn.disabled =false;
    chatInput.placeholder = "Type your message..";
    chatInput.focus();

    //bot reply to user details.
    await botSay(`you are connected to user : first name: ${data.firstName}  , surname: ${data.surname} , email:${data.email}`,data)

  } );

  }

async function getChatHistory() {
  if(  sessionStorage.getItem('user-chatbot-details') ===null)return;
  const data =JSON.parse(sessionStorage.getItem('user-chatbot-details'));

  const history = await getChat(`/chatbot/chat?firstName=${encodeURIComponent(data.firstName)}/&surname=${encodeURIComponent(data.surname)}/&email=${encodeURIComponent(data.email)} `,data);
  if(history.error.length>0)alert(history.error);
  addMessage(buildUserDetailsMessage(data),'user');
  //unlock the chatbot form
  chatInput.disabled =false;
  sendBtn.disabled =false;
  chatInput.placeholder = "Type your message..";
  chatInput.focus();

    if(history.error.length>0){

  */
 let content
  if(history.data){
    for (const chats of history.data){
    for(const chat of chats){

    //add user messages
      if(chat.role==="user"){
      //skip conversation starter
      if(!chat.content.includes(`you are connected to user : first name: ${data.firstName}  , surname: ${data.surname} , email:${data.email}`))
      content = chat.content;
      const start = content.indexOf("user abuse stats:");

      content = content.slice(0,start);
      const end = content.indexOf("prompt:");

      content = content.slice(end+String("prompt:").length);


      addMessage(content,'user',false);
      }
    else if(chat.role==="assistant"){

    //alert(JSON.stringify(item[1].content))
    for (const bot_item of chat.content){
      if(bot_item.type ==="text")addMessage(bot_item.text,'bot',true);

    }      

    }      

    }


    }

  }

}

  //step 2 chatting
  chatbotForm.addEventListener("submit",async(e)=>{
    e.preventDefault();
    const text = chatInput.value.trim();
    if(!text)return;

    addMessage(text,"user");
    chatInput.value ="";
    chatInput.focus();

    // bot reply
    //alert(JSON.parse(sessionStorage.getItem('user-chatbot-details')))
    await botSay(text,JSON.parse(sessionStorage.getItem('user-chatbot-details')));
  //reset timer on use
  if(clearChatId)clearTimeout(clearChatId);
  //30 mins
  if(clearChatId === null)clearChatId = setTimeout(()=>{clearChat()},1800000)

  });
  //set the clearchat timer
  if(clearChatId === null)clearChatId = setTimeout(()=>{clearChat()},1800000)

  //start chat  if we haven't stored user data/first time using the chat 
  //alert(JSON.parse(sessionStorage.getItem('user-chatbot-details')))
  if(  sessionStorage.getItem('user-chatbot-details') !==null){
    if(Object.keys(JSON.parse(sessionStorage.getItem('user-chatbot-details'))).length ===0 ) await startChat();
   //else get chat history
  else  await getChatHistory();      
  }else   await startChat();

  })();
