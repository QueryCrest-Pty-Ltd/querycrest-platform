<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
  <script src="https://unpkg.com/phosphor-icons"></script>  
<style>
/* =========================================
   1. CHATBOT MAIN CONTAINER & TOGGLE
   ========================================= */
.chatbot {
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 350px;
  height: 550px;
  max-height: calc(100vh - 120px);
  background-color: #ffffff;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 9999;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.chatbot.hide {
  opacity: 0;
  pointer-events: none;
  transform: translateY(20px);
}

/* =========================================
   FLOATING TOGGLE BUTTON & LABEL
   ========================================= */
.chatbot-toggle-container {
  position: fixed !important;
  bottom: 24px !important;
  right: 24px !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: flex-end !important;
  gap: 10px !important;
  z-index: 99999 !important;
}

/* --- The "Need help?" Text Bubble --- */
.toggle-label {
  background-color: #ffffff;
  color: #1f2937;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid #e5e7eb;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  cursor: pointer;
  transition: transform 0.2s ease;
}

.toggle-label:hover {
  transform: translateY(-2px);
}

/* --- The Circular Chat Button --- */
.chatbot-toggle {
  position: relative !important; /* Important: overrides old fixed position */
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background-color: #1d4ed8;
  color: white;
  border: none;
  box-shadow: 0 4px 12px rgba(29, 78, 216, 0.4);
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s;
}
.chatbot-toggle:hover {
  transform: scale(1.05);
}


.chatbot-toggle-container.hide {
  display: none !important;
}
/* =========================================
   2. HEADER (DARK BLUE) & SUBHEADER
   ========================================= */
.chatbot-header {
  background-color: #0d3b8e;
  color: #ffffff;
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.bot-avatar {
  width: 40px;
  height: 40px;
  background-color: rgba(255, 255, 255, 0.15);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.header-text h1 {
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 2px 0;
  line-height: 1.2;
}

.header-text p {
  font-size: 11px;
  margin: 0;
  color: #a0b9e8;
  display: flex;
  align-items: center;
  gap: 5px;
}

.status-dot {
  width: 6px;
  height: 6px;
  background-color: #4ade80;
  border-radius: 50%;
  display: inline-block;
}

.chatbot-top-ui-right {
  display: flex;
  gap: 8px;
}

.chatbot-top-ui-right button {
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: white;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 14px;
  transition: background 0.2s;
}

.chatbot-top-ui-right button:hover {
  background: rgba(255, 255, 255, 0.25);
}

.chatbot-subheader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background-color: #ffffff;
  border-bottom: 1px solid #e5e7eb;
}

.subheader-title {
  font-size: 13px;
  color: #0d3b8e;
  font-weight: 500;
}

.new-convo-btn {
  background-color: #1d4ed8;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

/* =========================================
   3. MESSAGES AREA & CHAT BUBBLES (MATCHING IMAGE 1)
   ========================================= */
.chatbot-messages {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  background-color: #ffffff;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Day Divider */
.chat-day-divider {
  text-align: center;
  font-size: 11px;
  color: #9ca3af;
  margin: 10px 0;
  position: relative;
}

.chat-day-divider::before,
.chat-day-divider::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 30%;
  height: 1px;
  background-color: #e5e7eb;
}
.chat-day-divider::before { left: 0; }
.chat-day-divider::after { right: 0; }

/* --- THE KEY FIX: Message Wrapper --- */
.message {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  max-width: 90%;
}

.message.bot {
  align-self: flex-start;
}

.message.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.msg-avatar {
  width: 24px;
  height: 24px;
  background-color: #1d4ed8;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 12px;
  flex-shrink: 0;
  margin-top: 4px;
}

/* --- THE KEY FIX: White Chat Bubble --- */
.msg-content {
  background-color: #ffffff; 
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.5;
  color: #1f2937;
  border: 1px solid #e5e7eb;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  border-bottom-left-radius: 4px; 
  width: auto; 
  max-width: 100%;
  box-sizing: border-box;
  word-wrap: break-word;
}


.message.user .msg-content {
  /**ackground-color: #1d4ed8;*//
  color: white;
  border: none;
  border-bottom-right-radius: 4px;
  border-bottom-left-radius: 12px;
}


.msg-content p {
  margin: 0 0 8px 0; 
}
.msg-content p:last-child {
  margin-bottom: 0;
}

.msg-time {
  font-size: 10px;
  color: #9ca3af;
  margin-top: 4px;
  display: block;
  margin-left: 32px;
}

/*
.message.user .msg-content {
  background-color: #1d4ed8;
  color: #ffffff;
  border: none;
  border-bottom-right-radius: 4px; 
  border-bottom-left-radius: 12px;
}
*/

.details-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 4px;
}
.details-row:last-child {
  margin-bottom: 0;
}


.message.user .msg-content strong {
  color: #a0b9e8;
  font-weight: 600;
  min-width: 80px; 
}
/* =========================================
   4. CHAT INPUT FORM AREA (BOTTOM)
   ========================================= */
.chatbotform {
  padding: 12px 16px;
  background-color: #ffffff;
  border-top: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  gap: 10px;
}

.chatbotform input {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid #d1d5db;
  border-radius: 20px;
  outline: none;
  font-size: 13px;
  color: #1f2937;
  background-color: #f9fafb;
}

.chatbotform input:focus {
  border-color: #1d4ed8;
  background-color: #ffffff;
}

.chatbotform input::placeholder {
  color: #9ca3af;
}

.chatbot-send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background-color: #1d4ed8;
  color: white;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.2s;
}

.chatbot-send-btn:hover {
  background-color: #1e3a8a;
}

/* =========================================
   5. FORM INPUTS INSIDE THE WHITE BUBBLE
   ========================================= */
.intro-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 12px;
  width: 100%;
}

.intro-form label {
  display: flex;
  flex-direction: column;
  font-size: 13px;
  font-weight: 600;
  color: #1f2937;
  gap: 4px;
}

.intro-form input {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid #9ca3af;
  border-radius: 4px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  box-sizing: border-box;
  background-color: #ffffff;
  color: #1f2937;
}

.intro-form input:focus {
  border-color: #1d4ed8;
}

.intro-form button[type="submit"] {
  background-color: #f3f4f6;
  color: #1f2937;
  border: 1px solid #9ca3af;
  padding: 6px 16px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  align-self: flex-start; 
  margin-top: 4px;
  transition: background 0.2s;
}

.intro-form button[type="submit"]:hover {
  background-color: #e5e7eb;
}

.intro-form .error {
  color: #ef4444;
  font-size: 12px;
  margin: 0;
  min-height: 16px;
}


/* =========================================
   6. MOBILE RESPONSIVENESS (FLOATING CARD)
   ========================================= */
@media (max-width: 480px) {
  .chatbot {

    position: fixed;
    top: 15px;
    bottom: 90px;
    left: 15px;
    right: 15px;
    
    width: auto;
    height: auto;
    max-height: none;
    
    border-radius: 12px;
    z-index: 9999;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); 
    
    display: flex;
    flex-direction: column;
  }
  

  .chatbot-toggle {
    bottom: 16px;
    right: 16px;
    display: flex; 
  }

  .chatbot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    padding-bottom: 20px;
  }

  .chatbotform {
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    flex-shrink: 0;
  }

 
  .chatbotform input {
    padding: 10px 14px;
    font-size: 14px;
  }

  .message {
    max-width: 95%; 
  }
  
  .msg-content {
    padding: 10px 14px;
  }
}
</style>
</head>
<body>


<!-- chatbot widget-->
<div class="chatbot hide" id="chatbotWidget">
  <!-- Top Dark Blue Header -->
<div class="chatbot-header">
  <div class="header-left">
<div class="bot-avatar"><i class="ph ph-robot"></i></div>
<div class="header-text">
  <h1>QueryCrest Assistant</h1>
  <p><span class="status-dot"></span>AI - Always available</p>
</div>
  </div>
<div class="chatbot-top-ui-right">
<button class="cbAddChat-btn" id="addCbChatBtn" title="Start new conversation">
        <i class="ph ph-plus"></i>
      </button>
  <button class="cbCancel-btn" id="cancelCbBtn" title="Close">
    <i class="ph ph-x"></i>
  </button>
</div>
</div>

<!--White Sub header-->
<div class="chatbot-subheader">
    <span class="subheader-title">Current conversation</span>
    <button class="new-convo-btn" id="newConvoBtn">+ New conversation</button>
  </div>

  <!--Chat Message Area-->
   <div class="chatbot-messages" id="chatbot-messages" aria-live="polite">
    <!-- Messages will be injected here via JS -->
  </div>

<form class="chatbotform" id="chatbotform" autocomplete="off">
<input type="text" id="chatbot-input" placeholder="Please complete the form above..." disabled>
<button type="submit" class="chatbot-send-btn" id="sendChatbotBtn">
  <i class="ph ph-paper-plane-tilt"></i>
</button>

</form>
</div>


<!-- Floating Toggle Button Container -->
<div class="chatbot-toggle-container" id="chatbotToggleContainer">
  <button class="toggle-label" id="chatbotLabelBtn">Need help?</button>
  <button class="chatbot-toggle" id="chatbotToggleBtn">
    <i class="ph ph-chat-circle-dots"></i>
  </button>
</div>


<!--chatbot-->
<script  src="js/chatbot.js" >


</script>
</body>
</html>
