<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
  <script src="https://unpkg.com/phosphor-icons"></script>  
<style>
:root {
  --brand:       #2563eb;
  --brand-dark:  #1d4ed8;
  --brand-light: #eff6ff;
  --brand-border:#bfdbfe;
  --text:        #0f172a;
  --text-2:      #334155;
  --text-muted:  #64748b;
  --border:      #e2e8f0;
  --bg:          #f8fafc;
  --white:       #ffffff;
  --success:     #16a34a;
  --warning:     #d97706;
  --danger:      #dc2626;
  --r-sm:        8px;
  --r-md:        14px;
  --r-lg:        20px;
  --shadow-sm:   0 1px 3px rgba(0,0,0,0.07);
  --shadow-md:   0 4px 14px rgba(0,0,0,0.10);
  --shadow-lg:   0 12px 32px rgba(0,0,0,0.14);
}
  *{ box-sizing:border-box; }

body{
  background-color: white;
}
/* =========================================
   1. CHATBOT MAIN CONTAINER & TOGGLE
   ========================================= */
.chatbot {
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 350px;
  height: 550px;
  max-height: calc(100vh - 120px);
  background-color: #ffffff;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 9999;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.chatbot.hide {
  opacity: 0;
  pointer-events: none;
  transform: translateY(20px);
}

/* =========================================
   FLOATING TOGGLE BUTTON & LABEL
   ========================================= */
.chatbot-toggle-container {
  position: fixed ;
  bottom: 24px ;
  right: 24px ;
  display: flex ;
  flex-direction: column ;
  align-items: flex-end ;
  gap: 10px ;
  z-index: 99999 ;
}

/* --- The "Need help?" Text Bubble --- */
.toggle-label {
  
  background-color: #ffffff;
  color: #1f2937;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid #e5e7eb;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  cursor: pointer;
  transition: transform 0.2s ease;
}

.toggle-label:hover {
  transform: translateY(-2px);
}

/* --- The Circular Chat Button --- */
.chatbot-toggle {
  position: relative ; /* Important: overrides old fixed position */
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background-color: #1d4ed8;
  color: white;
  border: none;
  box-shadow: 0 4px 12px rgba(29, 78, 216, 0.4);
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s;
}
.chatbot-toggle:hover {
  transform: scale(1.05);
}


.chatbot-toggle-container.hide {
  display: none ;
}
/* =========================================
   2. HEADER (DARK BLUE) & SUBHEADER
   ========================================= */
.chatbot-header {
  background-color: #0d3b8e;
  color: #ffffff;
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.bot-avatar {
  width: 40px;
  height: 40px;
  background-color: rgba(255, 255, 255, 0.15);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.header-text h1 {
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 2px 0;
  line-height: 1.2;
}

.header-text p {
  font-size: 11px;
  margin: 0;
  color: #a0b9e8;
  display: flex;
  align-items: center;
  gap: 5px;
}

.status-dot {
  width: 6px;
  height: 6px;
  background-color: #4ade80;
  border-radius: 50%;
  display: inline-block;
}

.chatbot-top-ui-right {
  display: flex;
  gap: 8px;
}

.chatbot-top-ui-right button {
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: white;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 14px;
  transition: background 0.2s;
}

.chatbot-top-ui-right button:hover {
  background: rgba(255, 255, 255, 0.25);
}

.chatbot-subheader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background-color: #ffffff;
  border-bottom: 1px solid #e5e7eb;
}

.subheader-title {
  font-size: 13px;
  color: #0d3b8e;
  font-weight: 500;
}

.new-convo-btn {
  background-color: #1d4ed8;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

/* =========================================
   3. MESSAGES AREA & CHAT BUBBLES (MATCHING IMAGE 1)
   ========================================= */
.chatbot-messages {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  background-color: #ffffff;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.chatbot-messages::-webkit-scrollbar{
  width: 8px;
  height:0;
}
.chatbot-messages::-webkit-scrollbar-thumb{
  background: var(--brand);
  border-radius: 8px;

}

/* Day Divider */
.chat-day-divider {
  text-align: center;
  font-size: 11px;
  color: #9ca3af;
  margin: 10px 0;
  position: relative;
}

.chat-day-divider::before,
.chat-day-divider::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 30%;
  height: 1px;
  background-color: #e5e7eb;
}
.chat-day-divider::before { left: 0; }
.chat-day-divider::after { right: 0; }

/* --- THE KEY FIX: Message Wrapper --- */
.message{
    display:flex;
    align-items:flex-end;
    gap:10px;
    animation:pop .25s ease both;
    max-width: 90%;
}

.message.bot {
  align-self: flex-start;
}

.message.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

 .avater {
  width: 40px;
  height: 40px;
  background-color: #1d4ed8;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 30px;
  flex-shrink: 0;
  margin-top: 4px;

}

.msg-avatar {
  width: 24px;
  height: 24px;
  background-color: #1d4ed8;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 12px;
  flex-shrink: 0;
  margin-top: 4px;
}

/* --- THE KEY FIX: White Chat Bubble --- */
/*.msg-content {
  background-color: #ffffff; 
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.5;
  color: #1f2937;
  border: 1px solid #e5e7eb;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  border-bottom-left-radius: 4px; 
  width: auto; 
  max-width: 100%;
  box-sizing: border-box;
  word-wrap: break-word;
}
*/
.message.user .avater{
  color: white;
  background: var(--brand);
}
.message.bot .avater{
  color: white;
  background:var(--brand);

}

.bubble{
max-width: 78%;
padding: 12px 14px;
font-size: 14.5px;
line-height: 1.5;
background: #fff;
border-radius: 16px;
border-bottom-left-radius: 4px;
box-shadow: 3px 3px 4px 2px rgba(2, 120, 255, 0.212);
word-wrap: break-word;
}

.message.user .bubble{
  background: var(--brand);
  color: #fff;
  border-radius: 16px;
  border-bottom-right-radius: 4px;
}

.message.wide .bubble{
  max-width: 88%;
}

.bubble p{
  margin:0 0 4px;
}
.bubble p:last-child{
    margin-bottom: 0;
  }






.msg-time {
  font-size: 10px;
  color: #9ca3af;
  margin-top: 4px;
  display: block;
  margin-left: 32px;
}

/*
.message.user .msg-content {
  background-color: #1d4ed8;
  color: #ffffff;
  border: none;
  border-bottom-right-radius: 4px; 
  border-bottom-left-radius: 12px;
}
*/

/* =========================================
   4. CHAT INPUT FORM AREA (BOTTOM)
   ========================================= */
.chatbotform {
  padding: 12px 16px;
  background-color: #ffffff;
  border-top: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  gap: 10px;
}

.chatbotform input {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid #d1d5db;
  border-radius: 20px;
  outline: none;
  font-size: 13px;
  color: #1f2937;
  background-color: #f9fafb;
}

.chatbotform input:focus {
  border-color: #1d4ed8;
  background-color: #ffffff;
}

.chatbotform input::placeholder {
  color: #9ca3af;
}

.chatbot-send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background-color: #1d4ed8;
  color: white;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.2s;
}

.chatbot-send-btn:hover {
  background-color: #1e3a8a;
}

/* =========================================
   5. FORM INPUTS INSIDE THE WHITE BUBBLE
   ========================================= */
/* In chat form*/
.intro-form{
 display: flex;
 flex-direction: column;
 gap: 10px;
 margin-top: 12px;
}

.intro-form label{
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color:var(--brand);
}

.intro-form input {
  width: 100%;
  padding:9px  11px;
  font-size:14px;
  color:var(--text);
  border:1px solid var(--brand);
  border-radius:10px;
  outline: none;
  transition: border-color .15s ,box-shadow .15s;
}

.intro-form input:focus{
  border-color: var(--brand-border);
  box-shadow: 0 0 0 3px rgba(79,70,229,.15);
}

.intro-form input:disabled{
  background: #f1f5f9;
  color: var(--text-muted);
  cursor: not-allowed;
}

.intro-form button {
  margin-top: 2px;
  padding: 10px;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  background: var(--brand);
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  transition: background .25s,transform .1s;
}

.intro-form button:hover:not(:disabled){background: var(--brand-dark);}
.intro-form button:active:not(:disabled){transform: scale(.98);}
.intro-form button:disabled{background: #a5b4fc; cursor: default;}

.intro-form .error{
  display: none;
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  color: red;

}

/*user details message*/
.details div {
  font-size:13.5px;
  line-height: 1.6;

}
.details strong {
  opacity:0.75; 
  font-weight: 600;

}


/*typing indicator*/
.bubble.typing {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 15px 16px;

}

.bubble.typing span{
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--brand);
  animation: bounce 1.2s infinite ease-in-out;
}

.bubble.typing span:nth-child(2){
  animation-delay: .15s;
}
.bubble.typing span:nth-child(3){
  animation-delay: .3s;  
}


.chatbotform{
  display:flex;
  gap:8px;
  padding: 12px;
  background: #fff;
  border-top: 1px solid #e8ecf3;
}

.chatbotform input {
  flex:1;
  min-width: 0;
  padding: 11px 16px;
  font-size: 14px;
  color: var(--text);
  border: 1px solid #cbd5e1;
  border-radius: 999px;
  outline: none;
  transition: border-color .15s ,box-shadow .15s;
}

.chatbotform input:focus{
  border-color:var(--brand);
  box-shadow: 0 0 0 3px rgba(79,70,229,.15);

}

.chatbotform input:disabled{
background: #f1f5f9;
cursor: not-allowed;

}

.chatbotform button{
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 25%;
  background: linear-gradient(135deg,rgba(0, 6, 41, 0.98) ,var(--brand));;
  color: #fff;
  font-size: 17px;
  cursor: pointer;
  transition: background .15s,transform .10s;
}

.chatbotform button:hover:not(:disabled){background: var(--brand-dark);}
.chatbotform button:active:not(:disabled){transform: scale(.94);}
.chatbotform button:disabled{background: #c7d2fe; cursor: not-allowed;}


@keyframes pop{
  from{opacity: 0;
  transform: translateY(8px);}
  to{opacity: 1;
  transform: none;}
}
@keyframes bounce{
  0%,60%,100%{
    transform: translateY(0);
    opacity: .5;
  }
  30%{
    transform: translateY(-5px);
    opacity: 1;
  }
}
/* =========================================
   6. MOBILE RESPONSIVENESS (FLOATING CARD)
   ========================================= */
@media (max-width: 480px) {
  .chatbot {

    position: fixed;
    top: 15px;
    bottom: 90px;
    left: 15px;
    right: 15px;
    
    width: auto;
    height: auto;
    max-height: none;
    
    border-radius: 12px;
    z-index: 9999;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); 
    
    display: flex;
    flex-direction: column;
  }
  

  .chatbot-toggle {
    bottom: 16px;
    right: 16px;
    display: flex; 
  }

  .chatbot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    padding-bottom: 20px;
  }

  .chatbotform {
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    flex-shrink: 0;
  }

 
  .chatbotform input {
    padding: 10px 14px;
    font-size: 14px;
  }

  .message {
    max-width: 95%; 
  }
  
  .msg-content {
    padding: 10px 14px;
  }
}
</style>
</head>
<body>


<!-- chatbot widget-->
<div class="chatbot hide" id="chatbotWidget">
  <!-- Top Dark Blue Header -->
<div class="chatbot-header">
  <div class="header-left">
<div class="bot-avatar"><i class="ph ph-robot"></i></div>
<div class="header-text">
  <h1>QueryCrest Assistant</h1>
  <p><span class="status-dot"></span>AI - Always available</p>
</div>
  </div>
<div class="chatbot-top-ui-right">
<button class="cbAddChat-btn" id="addCbChatBtn" title="Start new conversation">
        <i class="ph ph-plus"></i>
      </button>
  <button class="cbCancel-btn" id="cancelCbBtn" title="Close">
    <i class="ph ph-x"></i>
  </button>
</div>
</div>

<!--White Sub header-->
<div class="chatbot-subheader">
    <span class="subheader-title">Current conversation</span>
    <button class="new-convo-btn" id="newConvoBtn">+ New conversation</button>
  </div>

  <!--Chat Message Area-->
   <div class="chatbot-messages" id="chatbot-messages" aria-live="polite">
    <!-- Messages will be injected here via JS -->
  </div>

<form class="chatbotform" id="chatbotform" autocomplete="off">
<input type="text" id="chatbot-input" placeholder="Please complete the form above..." disabled>
<button type="submit" class="chatbot-send-btn" id="sendChatbotBtn">
  <i class="ph ph-paper-plane-tilt"></i>
</button>

</form>
</div>


<!-- Floating Toggle Button Container -->
<div class="chatbot-toggle-container" id="chatbotToggleContainer">
  <button class="toggle-label" id="chatbotLabelBtn">Need help?</button>
  <button class="chatbot-toggle" id="chatbotToggleBtn">
    <i class="ph ph-chat-circle-dots"></i>
  </button>
</div>


<!--chatbot-->
<script  src="js/chatbot.js" ></script>



</script>
</body>
</html>
